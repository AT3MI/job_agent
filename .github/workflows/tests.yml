name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall config src extract_facts.py
      - name: Offline tests (no API)
        run: python test_linguist.py
